<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>天弱 · 火花</title>
<link rel="icon" href="/avatar/tianruo?size=64">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app">
  <div id="boot" class="boot">
    <div class="boot-logo">⚡</div>
    <div class="boot-title">天弱</div>
    <div class="boot-sub">正在连接服务器…</div>
    <div class="boot-spin"></div>
  </div>
</div>

<!-- 服务器地址设置（首次打开或点设置时弹出） -->
<div id="serverModal" class="modal hidden">
  <div class="modal-mask" data-close></div>
  <div class="modal-box">
    <div class="modal-title">设置服务器地址</div>
    <div class="modal-desc">填入 天弱 服务端的地址即可联网使用，例如 <code>http://1.2.3.4:3000</code></div>
    <input id="serverInput" class="input" placeholder="http://服务器IP:3000" autocomplete="off">
    <div class="row-gap"></div>
    <button id="serverSave" class="btn btn-primary btn-block">保存并连接</button>
    <button class="btn btn-ghost btn-block" data-close>取消</button>
    <div class="modal-tip">本机调试可直接留空（同源）</div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pages.js"></script>
<script src="/js/pages2.js"></script>
<script src="/js/pages3.js"></script>
<script src="/js/pages4.js"></script>
<script src="/js/app.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  }
</script>
</body>
</html>
